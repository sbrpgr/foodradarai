<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여행 일정 생성기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    p { margin: 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary:hover { background: #d1d5db; }

    .result-title {
      margin: 0 0 12px;
      font-size: 1.2rem;
    }

    .day {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      background: #fcfdff;
    }

    .day h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: #111827;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
      color: #374151;
    }

    .hint { margin-top: 8px; font-size: 0.86rem; }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🧳 여행 일정 생성기</h1>
      <p>목적지/기간/테마를 입력하면 하루 단위 일정을 자동으로 생성합니다.</p>

      <div class="grid">
        <div>
          <label for="destination">목적지</label>
          <input id="destination" type="text" placeholder="예: 도쿄, 제주, 파리" />
        </div>
        <div>
          <label for="startDate">출발일</label>
          <input id="startDate" type="date" />
        </div>
        <div>
          <label for="days">여행 일수</label>
          <input id="days" type="number" min="1" max="14" value="3" />
        </div>
        <div>
          <label for="style">여행 스타일</label>
          <select id="style">
            <option value="힐링">힐링</option>
            <option value="미식">미식</option>
            <option value="액티비티">액티비티</option>
            <option value="문화/예술">문화/예술</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn">일정 만들기</button>
        <button id="resetBtn" class="secondary" type="button">초기화</button>
      </div>
      <p class="hint">※ 실제 예약 전 운영시간/휴무일은 꼭 확인하세요.</p>
    </section>

    <section class="card" id="resultCard">
      <h2 class="result-title">결과 화면</h2>
      <p id="emptyText">입력 후 <strong>일정 만들기</strong> 버튼을 눌러주세요.</p>
      <div id="result"></div>
    </section>
  </main>

  <script>
    const templates = {
      "힐링": ["브런치 카페", "대표 공원 산책", "스파/온천", "야경 명소"],
      "미식": ["로컬 조식 맛집", "시장 먹거리 투어", "대표 레스토랑", "디저트 투어"],
      "액티비티": ["아침 러닝/트레킹", "체험 액티비티", "스포츠/레저", "선셋 포인트"],
      "문화/예술": ["박물관/미술관", "역사 지구 산책", "로컬 공연 관람", "책방/갤러리"]
    };

    const destinationEl = document.getElementById("destination");
    const startDateEl = document.getElementById("startDate");
    const daysEl = document.getElementById("days");
    const styleEl = document.getElementById("style");
    const generateBtn = document.getElementById("generateBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultEl = document.getElementById("result");
    const emptyTextEl = document.getElementById("emptyText");

    function formatDate(baseDate, offset) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + offset);
      return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    }

    function generatePlan() {
      const destination = destinationEl.value.trim();
      const startDate = startDateEl.value;
      const days = Number(daysEl.value);
      const style = styleEl.value;

      if (!destination) {
        alert("목적지를 입력해주세요.");
        destinationEl.focus();
        return;
      }

      if (!startDate) {
        alert("출발일을 선택해주세요.");
        startDateEl.focus();
        return;
      }

      if (!days || days < 1 || days > 14) {
        alert("여행 일수는 1~14일 사이로 입력해주세요.");
        daysEl.focus();
        return;
      }

      const blocks = [];
      const places = templates[style] || templates["힐링"];

      for (let i = 0; i < days; i += 1) {
        const title = `${i + 1}일차 · ${formatDate(startDate, i)}`;
        const items = [
          `${destination} ${places[0]}`,
          `${destination} ${places[1]}`,
          `${destination} ${places[2]}`,
          `${destination} ${places[3]}`
        ];

        blocks.push(`
          <article class="day">
            <h3>${title}</h3>
            <ul>
              <li>오전: ${items[0]}</li>
              <li>점심: ${items[1]}</li>
              <li>오후: ${items[2]}</li>
              <li>저녁: ${items[3]}</li>
            </ul>
          </article>
        `);
      }

      emptyTextEl.style.display = "none";
      resultEl.innerHTML = `
        <p><strong>${destination}</strong> · <strong>${days}일</strong> · <strong>${style}</strong> 테마 일정입니다.</p>
        ${blocks.join("")}
      `;
    }

    function resetForm() {
      destinationEl.value = "";
      startDateEl.value = "";
      daysEl.value = 3;
      styleEl.value = "힐링";
      resultEl.innerHTML = "";
      emptyTextEl.style.display = "block";
      destinationEl.focus();
    }

    generateBtn.addEventListener("click", generatePlan);
    resetBtn.addEventListener("click", resetForm);
  </script>
</body>
</html>
