<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 일정관리 도구</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen">
    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <section class="bg-white shadow-lg rounded-2xl p-6 md:p-8">
            <header class="mb-8">
                <h1 class="text-3xl font-bold text-slate-800">📅 간단한 일정관리 도구</h1>
                <p class="text-slate-500 mt-2">일정을 추가하고 완료/삭제를 관리해보세요. (로컬 저장)</p>
            </header>

            <form id="schedule-form" class="grid md:grid-cols-4 gap-3 mb-6">
                <input id="title" type="text" placeholder="일정 제목" class="input-box md:col-span-2" required>
                <input id="date" type="date" class="input-box" required>
                <button class="btn-primary" type="submit">
                    <i class="fa-solid fa-plus mr-1"></i>추가
                </button>
                <textarea id="note" rows="2" placeholder="메모 (선택)" class="input-box md:col-span-4 resize-none"></textarea>
            </form>

            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div id="summary" class="text-sm text-slate-600"></div>
                <button id="clear-completed" class="btn-secondary" type="button">완료 일정 전체 삭제</button>
            </div>

            <ul id="schedule-list" class="space-y-3"></ul>
            <p id="empty-state" class="text-center text-slate-400 py-10">등록된 일정이 없습니다.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
