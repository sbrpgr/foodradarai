<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물 추천 AI 웹페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Noto Sans KR", sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <main class="max-w-5xl mx-auto px-4 py-10">
        <header class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800">🎁 선물 추천 AI</h1>
            <p class="text-slate-600 mt-2">정보 입력하면 상황에 맞는 선물 아이디어를 바로 추천해드립니다.</p>
        </header>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <h2 class="text-xl font-semibold text-slate-800 mb-4">입력 정보</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="text-sm text-slate-600">누구에게 선물하나요?</label>
                    <input id="recipient" type="text" placeholder="예: 30대 회사 동료" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="text-sm text-slate-600">어떤 상황인가요?</label>
                    <input id="occasion" type="text" placeholder="예: 퇴사 축하, 생일, 기념일" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="text-sm text-slate-600">관계</label>
                    <select id="relationship" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                        <option value="동료">회사 동료</option>
                        <option value="친구">친구</option>
                        <option value="연인">연인</option>
                        <option value="가족">가족</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-slate-600">예산</label>
                    <select id="budget" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                        <option value="1~3만원">1~3만원</option>
                        <option value="3~5만원">3~5만원</option>
                        <option value="5~10만원">5~10만원</option>
                        <option value="10만원 이상">10만원 이상</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="text-sm text-slate-600">취향/키워드 (선택)</label>
                    <input id="keywords" type="text" placeholder="예: 커피, 향수, 데스크테리어, 운동" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
            </div>
            <div class="mt-5 flex flex-wrap gap-2">
                <button onclick="applyExample('회사 동료', '퇴사 축하', '동료', '3~5만원', '실용적인 선물, 문구')" class="text-xs px-3 py-1 rounded-full border border-pink-200 text-pink-700 bg-pink-50">예시: 동료 퇴사</button>
                <button onclick="applyExample('여자친구', '100일 기념일', '연인', '5~10만원', '감성, 향기, 편지')" class="text-xs px-3 py-1 rounded-full border border-pink-200 text-pink-700 bg-pink-50">예시: 연인 기념일</button>
                <button onclick="applyExample('부모님', '결혼기념일', '가족', '10만원 이상', '건강, 프리미엄')" class="text-xs px-3 py-1 rounded-full border border-pink-200 text-pink-700 bg-pink-50">예시: 부모님 기념일</button>
            </div>
            <button onclick="recommendGifts()" class="mt-5 w-full md:w-auto px-6 py-3 rounded-lg bg-pink-600 text-white font-medium hover:bg-pink-700">
                추천 받기
            </button>
        </section>

        <section id="resultsSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-xl font-semibold text-slate-800 mb-1">추천 결과</h2>
                <p id="resultSummary" class="text-sm text-slate-600 mb-4"></p>
                <div id="cards" class="grid md:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>

    <script>
        const recommendationPool = [
            { name: "프리미엄 텀블러", tags: ["실용", "데일리", "오피스"], tip: "이니셜 각인을 넣으면 만족도가 높아요." },
            { name: "핸드크림 + 립밤 세트", tags: ["가벼움", "무난함", "센스"], tip: "향이 강하지 않은 제품으로 고르면 실패 확률이 낮아요." },
            { name: "디퓨저 + 캔들 세트", tags: ["감성", "인테리어", "기념일"], tip: "향 취향(우디/시트러스)을 먼저 파악하세요." },
            { name: "스페셜티 원두 기프트박스", tags: ["커피", "취향존중", "프리미엄"], tip: "드립백 형태를 섞으면 접근성이 좋아요." },
            { name: "백화점/온라인 기프트카드", tags: ["안전", "실패적음", "선택권"], tip: "짧은 손편지를 같이 주면 성의가 커집니다." },
            { name: "마사지/스파 이용권", tags: ["힐링", "고급", "부모님"], tip: "접근성 좋은 지점인지 꼭 확인하세요." }
        ];

        function applyExample(recipient, occasion, relationship, budget, keywords) {
            document.getElementById("recipient").value = recipient;
            document.getElementById("occasion").value = occasion;
            document.getElementById("relationship").value = relationship;
            document.getElementById("budget").value = budget;
            document.getElementById("keywords").value = keywords;
        }

        function recommendGifts() {
            const recipient = document.getElementById("recipient").value.trim();
            const occasion = document.getElementById("occasion").value.trim();
            const relationship = document.getElementById("relationship").value;
            const budget = document.getElementById("budget").value;
            const keywords = document.getElementById("keywords").value.trim().toLowerCase();

            if (!recipient || !occasion) {
                alert("누구에게/어떤 상황인지 입력해주세요.");
                return;
            }

            const selected = recommendationPool
                .map(item => ({ ...item, score: scoreItem(item, relationship, keywords) }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 4);

            const cards = document.getElementById("cards");
            cards.innerHTML = selected.map(item => `
                <article class="p-4 rounded-xl border border-slate-200 bg-slate-50">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-semibold text-slate-800">${item.name}</h3>
                        <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded-full">${budget}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-2">${item.tags.join(" · ")}</p>
                    <p class="text-sm text-slate-700 mb-2">${recipient}에게 주는 ${occasion} 선물로 적합한 아이템입니다.</p>
                    <p class="text-xs text-pink-700">💡 ${item.tip}</p>
                </article>
            `).join("");

            document.getElementById("resultSummary").textContent = `${recipient} · ${occasion} · ${budget} 기준으로 추천했어요.`;
            document.getElementById("resultsSection").classList.remove("hidden");
            document.getElementById("resultsSection").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function scoreItem(item, relationship, keywords) {
            let score = 0;
            if (relationship === "연인" && item.tags.includes("감성")) score += 3;
            if (relationship === "가족" && item.tags.includes("부모님")) score += 3;
            if (relationship === "동료" && item.tags.includes("실용")) score += 3;
            if (relationship === "친구" && item.tags.includes("무난함")) score += 2;

            if (keywords) {
                const tokens = keywords.split(",").map(v => v.trim()).filter(Boolean);
                tokens.forEach(token => {
                    if (item.name.toLowerCase().includes(token) || item.tags.join(" ").toLowerCase().includes(token)) {
                        score += 2;
                    }
                });
            }

            return score + Math.random();
        }
    </script>
</body>
</html>
